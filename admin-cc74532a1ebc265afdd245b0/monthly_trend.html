const storeNames = Object.keys(ALL_TRENDS);

const sel = document.getElementById("storeSel");
storeNames.forEach(name => {
  const opt = document.createElement("option");
  opt.value = name;
  opt.textContent = name;
  sel.appendChild(opt);
});

function renderCard(store) {
  const cardArea = document.getElementById("cardArea");
  const trend = ALL_TRENDS[store];
  if (!trend) {
    cardArea.innerHTML = '<div class="card"><div class="empty-state">この店舗はまだ十分な実績データがありません。</div></div>';
    return;
  }
  const avg6Label = (trend.avg6_months && trend.avg6_months.length)
    ? trend.avg6_months.slice().reverse().join(", ") : "";
  const lastYearMissing = !trend.last_year || Object.keys(trend.last_year).length === 0;

  cardArea.innerHTML = `
    <div class="card">
      <div class="legend">
        <div class="legend-item"><span class="legend-swatch" style="background:#4f46e5;"></span>今月（${trend.current_month}）</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#94a3b8;"></span>直近6ヶ月平均${avg6Label ? "（" + avg6Label + "）" : ""}</div>
        <div class="legend-item"><span class="legend-swatch" style="background:#d97706;"></span>前年同月（${trend.last_year_month}）${lastYearMissing ? "※データなし" : ""}</div>
      </div>
      <div id="chartWrap">
        <canvas id="chartCanvas"></canvas>
        <div class="tooltip" id="chartTooltip"></div>
      </div>
      <div class="note">
        各線は日次の店舗全体差枚合計を月初から累積したもの。「直近6ヶ月平均」は各月の同じ日にち位置の累積値を平均している（月によって日数が違うため、月末に近いほど平均対象の月数が減る場合がある）。
      </div>
    </div>
  `;
  drawChart(trend);
}

function drawChart(trend) {
  const canvas = document.getElementById("chartCanvas");
  const wrap = document.getElementById("chartWrap");
  const tooltip = document.getElementById("chartTooltip");
  const dpr = window.devicePixelRatio || 1;
  const cssW = wrap.clientWidth;
  const cssH = 380;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const pad = { left: 60, right: 20, top: 20, bottom: 30 };
  const plotW = cssW - pad.left - pad.right;
  const plotH = cssH - pad.top - pad.bottom;

  const current = trend.current || {};
  const avg6 = trend.avg6 || {};
  const lastYear = trend.last_year || {};

  const allDays = new Set();
  Object.keys(current).forEach(d => allDays.add(+d));
  Object.keys(avg6).forEach(d => allDays.add(+d));
  Object.keys(lastYear).forEach(d => allDays.add(+d));
  const maxDay = allDays.size ? Math.max(...allDays) : 31;

  const allVals = []
    .concat(Object.values(current))
    .concat(Object.values(avg6))
    .concat(Object.values(lastYear));
  let minV = allVals.length ? Math.min(...allVals, 0) : 0;
  let maxV = allVals.length ? Math.max(...allVals, 0) : 0;
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const vSpan = maxV - minV;

  function xOf(day) { return pad.left + ((day - 1) / Math.max(maxDay - 1, 1)) * plotW; }
  function yOf(val) { return pad.top + (1 - (val - minV) / vSpan) * plotH; }

  ctx.strokeStyle = "#e2e8f0";
  ctx.fillStyle = "#64748b";
  ctx.font = "11px sans-serif";
  ctx.lineWidth = 1;
  const gridLines = 5;
  for (let i = 0; i <= gridLines; i++) {
    const v = minV + (vSpan * i / gridLines);
    const y = yOf(v);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(cssW - pad.right, y);
    ctx.stroke();
    ctx.fillText(Math.round(v).toLocaleString(), 4, y + 4);
  }
  if (minV < 0 && maxV > 0) {
    ctx.strokeStyle = "#94a3b8";
    ctx.beginPath();
    ctx.moveTo(pad.left, yOf(0));
    ctx.lineTo(cssW - pad.right, yOf(0));
    ctx.stroke();
  }
  ctx.fillStyle = "#64748b";
  for (let d = 1; d <= maxDay; d += Math.ceil(maxDay / 10)) {
    ctx.fillText(d + "日", xOf(d) - 8, cssH - 8);
  }

  function drawLine(dataObj, color, width) {
    const days = Object.keys(dataObj).map(Number).sort((a, b) => a - b);
    if (!days.length) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    days.forEach((d, i) => {
      const x = xOf(d), y = yOf(dataObj[d]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  drawLine(avg6, "#94a3b8", 2);
  drawLine(lastYear, "#d97706", 2);
  drawLine(current, "#4f46e5", 2.5);

  canvas.onmousemove = function (e) {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const day = Math.round(1 + ((mx - pad.left) / plotW) * (maxDay - 1));
    if (day < 1 || day > maxDay) { tooltip.style.opacity = 0; return; }
    const lines = [];
    if (current[day] !== undefined) lines.push("今月: " + Math.round(current[day]).toLocaleString());
    if (avg6[day] !== undefined) lines.push("6ヶ月平均: " + Math.round(avg6[day]).toLocaleString());
    if (lastYear[day] !== undefined) lines.push("前年同月: " + Math.round(lastYear[day]).toLocaleString());
    if (!lines.length) { tooltip.style.opacity = 0; return; }
    tooltip.innerHTML = day + "日<br>" + lines.join("<br>");
    tooltip.style.left = xOf(day) + "px";
    tooltip.style.top = "20px";
    tooltip.style.opacity = 1;
  };
  canvas.onmouseleave = function () { tooltip.style.opacity = 0; };
}

sel.addEventListener("change", () => renderCard(sel.value));

if (storeNames.length) {
  renderCard(storeNames[0]);
} else {
  document.getElementById("cardArea").innerHTML = '<div class="card"><div class="empty-state">まだデータがありません。</div></div>';
}
window.addEventListener("resize", () => { if (sel.value) renderCard(sel.value); });
