const areaKeys = Object.keys(ALL_GUIDES);

const sel = document.getElementById("areaSel");
areaKeys.forEach(key => {
  const opt = document.createElement("option");
  opt.value = key;
  opt.textContent = key === "" ? "全エリア" : key;
  sel.appendChild(opt);
});

function renderGuide(key) {
  const guide = ALL_GUIDES[key];
  const contextArea = document.getElementById("contextArea");
  const listArea = document.getElementById("listArea");
  if (!guide) {
    contextArea.innerHTML = "";
    listArea.innerHTML = '<div class="empty-state">データがありません。</div>';
    return;
  }

  contextArea.innerHTML = `
    <div class="context-card">
      <span><b>${guide.weekday_name}曜・${guide.day_position}</b> の型に基づくランキング</span>
      ${guide.is_zorome_day ? '<span class="zorome-flag">\uD83C\uDFB2 本日はゾロ目日</span>' : ''}
    </div>
  `;

  if (!guide.has_data || !guide.stores.length) {
    listArea.innerHTML = '<div class="empty-state">この条件ではまだ十分な実績データがありません。</div>';
    return;
  }

  listArea.innerHTML = `
    <div class="store-list">
      ${guide.stores.map(s => `
        <div class="store-card ${s.rank === 1 ? 'rank-1' : ''}">
          <div class="rank-badge">${s.rank}</div>
          <div class="store-body">
            <div class="store-head">
              <span class="store-name">${s.store}</span>
              ${s.area ? `<span class="store-area">${s.area}</span>` : ''}
              <span class="store-score">score ${s.score.toFixed(3)}</span>
            </div>
            <ul class="reason-list">
              ${s.reasons.map(r => `<li>${r}</li>`).join('')}
            </ul>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

sel.addEventListener("change", () => renderGuide(sel.value));
if (areaKeys.length) renderGuide(areaKeys[0]);
