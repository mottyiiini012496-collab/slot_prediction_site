<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店の攻略メモ</title>
<style>
  :root {
    --bg:#f1f5f9; --card:#fff; --border:#e2e8f0; --text:#0f172a; --dim:#64748b;
    --hot:#b45309; --hot-bg:rgba(180,83,9,.10); --cool:#0369a1; --cool-bg:rgba(3,105,161,.10);
    --pos:#16a34a; --neg:#dc2626; --accent:#4f46e5;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 12px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Segoe UI","Hiragino Kaku Gothic ProN",sans-serif;font-size:14px}
  /* ---- スクロール追従ナビ（2026-09-06）----
     タイトル・タブ・店舗選択を1つにまとめ、画面上部に貼り付ける。
     ページが縦に長い（店ごとの複数カード／全店早見表／ヒートマップ）ため、
     読んでいる途中でタブや店舗を切り替えたいときに毎回スクロールして
     戻らなくて済むようにする（masaharuさんの「画面上部にNAVIが
     あってもよいかも。導線を整理して」への対応）。 */
  .navbar{position:sticky;top:0;z-index:30;background:#fff;
        border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(15,23,42,.05)}
  .navbar-inner{max-width:920px;margin:0 auto;padding:10px 16px 12px}
  .navbar h1{font-size:15.5px;margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
  .navbar h1::before{content:"\1F4D3"}
  .navbar .meta{font-size:11px;color:var(--dim);margin-bottom:9px}
  .wrap{padding:16px;max-width:920px;margin:0 auto}
  .picker{display:flex;gap:10px;align-items:center;margin-bottom:0;flex-wrap:wrap}
  select{padding:8px 12px;border-radius:8px;border:1px solid var(--border);
         font-size:15px;font-weight:600;background:#fff;max-width:100%}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
        padding:14px 16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{font-size:14px;margin:0 0 10px}
  .card h2 .sub{font-size:11.5px;color:var(--dim);font-weight:500;margin-left:6px}
  .today{border-color:rgba(180,83,9,.3);background:linear-gradient(0deg,#fff,var(--hot-bg))}
  .today h2{color:var(--hot)}
  ul{margin:0;padding-left:20px;line-height:1.85}
  .verdict{font-size:14.5px;font-weight:700;padding:9px 12px;border-radius:9px;margin-bottom:8px}
  .verdict.hot{background:var(--hot-bg);color:var(--hot)}
  .verdict.cool{background:var(--cool-bg);color:var(--cool)}
  .verdict.neutral{background:#f1f5f9;color:var(--dim)}
  .verdict .why{display:block;font-size:12px;font-weight:500;margin-top:3px;opacity:.85}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--border)}
  th{background:#f8fafc;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.04em}
  td.l,th.l{text-align:left}
  tr:last-child td{border-bottom:none}
  .pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}
  .dim{color:var(--dim)}
  .cand{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px}
  .cand.top{border-color:var(--hot);background:var(--hot-bg)}
  .ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .ch .rank{font-weight:800;color:var(--hot);font-size:12px}
  .ch .name{font-weight:700;font-size:14px}
  .ch .prob{margin-left:auto;font-weight:700;font-size:12.5px}
  .bar{display:flex;align-items:center;gap:7px;font-size:11.5px;margin-top:2px}
  .bar .lbl{width:170px;color:var(--dim);flex:none}
  .bar .tr{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
  .bar .fl{height:100%;background:var(--hot)}
  .bar .vl{width:56px;text-align:right;font-weight:600;flex:none}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .badge.sig{background:rgba(22,163,74,.12);color:var(--pos)}
  .badge.dim{background:#f1f5f9;color:var(--dim)}
  .empty{color:var(--dim);font-size:12.5px;padding:6px 0}
  .note{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:8px}
  .warn{background:#fef2f2;border:1px solid #fecaca;border-radius:9px;padding:9px 12px;
        font-size:11.5px;color:#b91c1c;margin-bottom:14px}
  .tabs{display:flex;gap:6px;margin-bottom:9px}
  .tabs button{flex:1;padding:9px 10px;border-radius:9px;border:1px solid var(--border);
        background:#fff;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .mchips button{padding:6px 12px;border-radius:999px;border:1px solid var(--border);
        background:#fff;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer}
  .mchips button.on{background:var(--hot);border-color:var(--hot);color:#fff}
  /* 有意セル0件の軸は淡く。押せば中身（＝空であること）は確認できる */
  .mchips button.off{opacity:.42}
  .mchips button .cnt{margin-left:5px;font-size:10.5px;font-weight:800;opacity:.75}
  .heat-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
  table.heat{border-collapse:collapse;font-size:11px;white-space:nowrap}
  table.heat th,table.heat td{padding:0;text-align:center;width:26px;height:26px}
  table.heat th{font-weight:700;color:#cbd5e1;font-size:10px;background:#f8fafc}
  /* 5日おきの目盛りだけ濃く。ラベルの無い列は目盛り線だけで位置が読める */
  table.heat th.dl{color:#0f172a;font-size:11px}
  table.heat th.d5,table.heat td.d5{border-left:2px solid #cbd5e1}
  table.heat thead th{position:sticky;top:0;z-index:1}
  table.heat td.hs{position:sticky;left:0;background:#fff;text-align:left;padding:0 10px 0 12px;
        font-weight:700;font-size:11.5px;white-space:nowrap;box-shadow:2px 0 4px rgba(15,23,42,.04);
        width:auto;height:auto;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  table.heat th.hs{position:sticky;left:0;background:#f8fafc;text-align:left;padding:0 10px 0 12px;
        z-index:3;width:auto;color:#0f172a}
  table.heat td.hc{cursor:default;border:1px solid #fff;font-weight:700;color:#1e293b}
  /* 2026-09-20: 「癖マトリクス」はヒートマップ（22店ぶん詰め込む必要がある）
     と違って、1店ぶん・7指標しか縦に並ばないので余裕がある。それなのに
     ヒートマップと同じ狭い列幅・5日おきだけラベルを流用していたため、
     「どの列が何日か分からない」「指標名が…で切れて分からない」と
     読みにくさの指摘を受けた（masaharuさん「日付やっぱりみづらい」）。
     マトリクス専用に、列幅を広げ・全ての日付にラベルを付け・指標名は
     省略せず折り返す。 */
  table.heat.mx th,table.heat.mx td{width:30px;height:30px;font-size:11.5px}
  table.heat.mx td.hs,table.heat.mx th.hs{max-width:180px;white-space:normal;
        line-height:1.3;font-size:11.5px;padding:6px 10px 6px 12px}
  /* 2026-09-21: 日付マトリクスに「1〜31日／◯のつく日／月末」の3グループを
     合流させた際の見出し（上段=グループ名・下段=個別ラベル）と、
     グループの境目を示す太い罫線。5日おきの薄い罫線(.d5)より目立たせる。 */
  table.heat.mx th.grp{font-size:10.5px;font-weight:800;color:#475569;background:#eef2f7}
  table.heat.mx th.gd,table.heat.mx td.gd{border-left:2px solid #64748b}
  /* 2026-09-22: 「今日行く（夜なら明日行く）店を探す」がそもそもの起点なので、
     ヒートマップ・癖マトリクスどちらでも該当する列（今日か夜は明日）を
     強調する。tdは背景色をheatColor()のインラインstyleで塗っているため、
     box-shadowの内側枠で重ねる（背景色そのものは変えない）。 */
  table.heat th.today{background:#eef2ff!important;color:var(--accent)!important;font-weight:800}
  table.heat td.today{box-shadow:inset 0 0 0 2px var(--accent)}
  .today-note{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;
        color:var(--accent);background:#eef2ff;border-radius:6px;padding:2px 8px;
        vertical-align:middle}
  /* 2026-09-21: 「◯のつく日」「月末」のセルは複数の暦日をまとめた値なので、
     タップすると実際のカレンダー日ごとの内訳（breakdown）を確認できる。
     タップできることが分かるよう、下に小さい点を付ける。 */
  table.heat.mx td.hc-bd{cursor:pointer;position:relative}
  table.heat.mx td.hc-bd::after{content:'';position:absolute;left:50%;bottom:2px;
        width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35;
        transform:translateX(-50%)}
  .mx-bd-panel{position:fixed;left:10px;right:10px;bottom:10px;max-width:480px;
        margin:0 auto;background:#fff;border:1px solid var(--border);border-radius:12px;
        padding:12px 14px 14px;box-shadow:0 10px 28px rgba(15,23,42,.18);
        font-size:12.5px;line-height:1.6;color:var(--text);z-index:60;display:none;
        max-height:60vh;overflow:auto}
  .mx-bd-panel.show{display:block}
  .mx-bd-panel h4{margin:0 0 6px;font-size:13px;font-weight:800;padding-right:24px}
  .mx-bd-panel .mx-bd-close{position:absolute;top:8px;right:10px;font-size:16px;
        font-weight:700;color:var(--dim);cursor:pointer;line-height:1;padding:4px}
  .mx-bd-panel table{width:100%;border-collapse:collapse;margin-top:6px}
  .mx-bd-panel td{padding:3px 4px;border-bottom:1px solid var(--border);font-size:12px}
  .mx-bd-panel td.pos{color:var(--pos);font-weight:700}
  .mx-bd-panel td.neg{color:var(--neg);font-weight:700}
  .mx-bd-panel .note{margin-top:8px;color:var(--dim);font-size:11px;line-height:1.6}
  @media(max-width:600px){
    table.heat.mx th,table.heat.mx td{width:25px;height:28px;font-size:10px}
    table.heat.mx td.hs,table.heat.mx th.hs{max-width:120px;font-size:10.5px}}
  .heat-empty{padding:22px 16px;border:1px dashed var(--border);border-radius:10px;
        background:#f8fafc;font-size:13px;line-height:1.7;color:#334155}
  .heat-empty .dim{color:var(--dim);font-size:11.5px}
  .heat-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:9px;
        font-size:11.5px;font-weight:700;color:var(--dim);cursor:pointer}
  .heat-legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
        margin-top:10px;flex-wrap:wrap}
  .heat-legend .sw{display:inline-block;width:16px;height:11px;border-radius:2px;vertical-align:middle}
  .pk{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .pk.hot3{border-color:var(--hot);background:var(--hot-bg)}
  .pk .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .pk .mno{font-size:18px;font-weight:800;letter-spacing:.02em}
  .pk .mdl{font-weight:700;font-size:13.5px}
  .pk .sc{margin-left:auto;font-size:11.5px;color:var(--dim);white-space:nowrap}
  .pk .ml{font-size:11.5px;font-weight:700;color:var(--cool)}
  .pk .score-badge{font-weight:700;color:var(--warm,#b45309);margin-left:8px}
  .pk .cond{font-size:12px;font-weight:700;color:var(--hot);margin-top:4px}
  .pk ul{margin:6px 0 0;padding-left:18px;line-height:1.7;font-size:12.5px}
  .pk .src{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;
        background:#eef2ff;color:var(--accent);margin-right:5px}
  .storehd{font-size:14.5px;font-weight:800;margin:18px 0 6px;padding-bottom:5px;
        border-bottom:2px solid var(--border)}
  .storehd .sg{display:block;font-size:11.5px;font-weight:600;color:var(--hot);margin-top:3px}
  .pkctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .pkctl label{font-size:11.5px;color:var(--dim);font-weight:700;display:flex;align-items:center;gap:4px}
  .pkctl select{padding:6px 9px;border-radius:8px;border:1px solid var(--border);
        font-size:13px;font-weight:600;background:#fff;max-width:100%}
  .pkctl input{flex:1;min-width:150px;padding:7px 10px;border-radius:8px;
        border:1px solid var(--border);font-size:14px}
  @media(max-width:600px){.pkctl input{min-width:100%;order:-1}}
  .sum{list-style:none;padding:0;margin:0}
  .sum li{padding:10px 12px;border-radius:9px;background:#f8fafc;margin-bottom:7px;
        border-left:4px solid var(--accent);line-height:1.55}
  .sum li.big{background:var(--hot-bg);border-left-color:var(--hot)}
  .sum .t{font-size:14.5px;font-weight:700}
  .sum .d{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
  .ov{width:100%;border-collapse:collapse;font-size:13px}
  .ov td{padding:9px;border-bottom:1px solid var(--border);vertical-align:top}
  .ov td.s{white-space:nowrap;font-weight:700;font-size:12px;color:var(--accent);width:1%}
  .ov td.d{text-align:right;white-space:nowrap;color:var(--dim);font-size:11.5px;width:1%}
  @media(max-width:600px){.bar .lbl{width:120px}
    .ov td.s{white-space:normal}.ov td.d{display:none}
    .tabs{gap:3px;flex-wrap:wrap}.tabs button{padding:8px 3px;font-size:10.5px;min-width:22%}
    table.heat th,table.heat td{width:19px;height:22px;font-size:10px}
    table.heat td.hs,table.heat th.hs{max-width:118px;font-size:10.5px;padding:0 6px 0 8px}}
  /* 2026-10-05: 「店×日付」カレンダー（縦=店・横=今日から31日）。
     masaharuさんの「攻略メモ、店×日付で見えるようにして」への対応。 */
  table.heat.cal th,table.heat.cal td{width:30px;height:30px;font-size:11px}
  table.heat.cal th.wd{color:#475569;font-size:10px}
  table.heat.cal th.sat{color:#2563eb}
  table.heat.cal th.sun{color:#dc2626}
  table.heat.cal th.mon1{border-left:2px solid #64748b}
  table.heat.cal td.mon1{border-left:2px solid #64748b}
  table.heat.cal td.cal-c{cursor:pointer}
  table.heat.cal td.cal-c.has{font-weight:800}
  .cal-item{padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.6}
  .cal-item:last-child{border-bottom:none}
  .cal-go{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:8px;
        background:var(--accent);color:#fff;font-weight:700;font-size:12px;cursor:pointer}
  @media(max-width:600px){table.heat.cal th,table.heat.cal td{width:26px;height:28px;font-size:10px}}
#tab-store{display:none}
#tab-matrix{display:none}
#tab-modelpair{display:none}
#tab-all{display:none}
#tab-heat{display:none}
#tab-cal{display:none}
</style>
</head>
<body>
<div class="navbar">
  <div class="navbar-inner">
    <h1>店の攻略メモ</h1>
    <div class="meta">2026-10-30 時点 ／ 生成 2026-10-29 20:23</div>
    <div class="tabs">
      <button id="tab-store" class="on">店ごとに見る</button>
      <button id="tab-matrix">癖マトリクス</button>
      <button id="tab-modelpair">店×機種の単独分析</button>
      <button id="tab-all">全店の癖 早見表</button>
      <button id="tab-heat">ヒートマップ</button>
      <button id="tab-cal">店×日付</button>
      <button id="tab-picks">今日の該当台</button>
    </div>
    <div class="picker" id="picker">
      <label for="sel"><b>店舗</b></label>
      <select id="sel"></select>
    </div>
  </div>
</div>
<div class="wrap">
  <div id="warn"></div>
  <div id="body"></div>
</div>
<div class="mx-bd-panel" id="mxBdPanel"></div>

function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function pp(v, d){ return (v >= 0 ? '+' : '') + Number(v).toFixed(d === undefined ? 2 : d); }
function cls(v){ return v > 0 ? 'pos' : 'neg'; }

function renderWarn(){
  const b = DATA.bad_days || {};
  if (!b.total) { document.getElementById('warn').innerHTML = ''; return; }
  const by = Object.entries(b.by_store || {}).map(([s,n]) => esc(s) + ' ' + n + '日').join(' / ');
  document.getElementById('warn').innerHTML =
    '<div class="warn">⚠ データ品質: 差枚が正しく取れていない店×日を ' + b.total +
    '件 検出したため、この集計から除外しています（' + by + '）。</div>';
}

function renderProfile(p){
  if (!p || p.store_type === 'データ不足' || !p.store_type)
    return '<div class="card"><h2>この店の性格</h2><p class="empty">まだ判定に十分なデータがありません。</p></div>';
  let cl = 'neutral', head = '中間 — 直近の調子だけでは決められない';
  if (p.store_type === '据え置き型'){ cl = 'hot'; head = '据え置き型 — 好調が続いている台を狙う'; }
  else if (p.store_type === '回転(復活)型'){ cl = 'cool'; head = '回転(復活)型 — 凹んでいる台を拾う'; }
  return '<div class="card"><h2>この店の性格 <span class="sub">好調台を追うか、凹み台を拾うか</span></h2>' +
    '<div class="verdict ' + cl + '">' + head +
    '<span class="why">連続プラス4日以上の台 ' + pp(p.hot_vs_base_pp,1) + 'pt ／ ' +
    '連続マイナス4日以上の台 ' + pp(p.deep_vs_base_pp,1) + 'pt（信頼度: ' + esc(p.confidence) + '）</span></div></div>';
}

function renderToday(sigs){
  // 2026-09-19: FDR非通過の仮説層も含めて返ってくるようになったので、
  // 確定/仮説を必ず併記する（検定を緩めた代わりに、判断材料は隠さない。
  // 内部の/store_reportページと同じ扱い）。
  let h = '<div class="card today"><h2>今日この店に効いていること</h2>';
  if (!sigs || !sigs.length) h += '<p class="empty">今日は、この店の特異日には当たっていません（普段どおりの日）。</p>';
  else {
    h += '<ul>' + sigs.map(s =>
      '<li>' + (s.significant ? '<span class="badge sig">確定</span>' : '<span class="badge dim">仮説</span>') +
      ' <b>' + esc(s.label) + '</b> — ' + esc(s.metric_label) +
      'が普段より ' + pp(s.effect_pp,1) + 'pt（z=' + Number(s.z).toFixed(1) + '、' + s.n + '件）' +
      (s.days_text ? ' <span class="dim">' + esc(s.days_text) + '</span>' : '') + '</li>').join('') + '</ul>';
  }
  return h + '</div>';
}

function renderCandidates(cs){
  // 2026-09-19: 全台系は発生率3.15%の稀な現象。get_candidates()側で
  // ランダム未満の機種は除外するようになったので、「毎日6件出る」ことは
  // 無くなった（0件の日の方がむしろ普通）。
  let h = '<div class="card"><h2>今日の全台系候補 <span class="sub">前日までの情報だけで予測（検証: AUC 0.731、上位1%は実発生率25.1%）</span></h2>';
  if (!cs || !cs.length) h += '<p class="empty">今日は、この店にランダムより強い全台系候補はありません' +
    '（全台系は毎日起きる現象ではありません）。</p>';
  else {
    cs.forEach((c, i) => {
      h += '<div class="cand' + (i === 0 ? ' top' : '') + '"><div class="ch">' +
        '<span class="rank">' + c.rank + '位</span><span class="name">' + esc(c.model) + '</span>' +
        '<span class="dim">' + c.n_machines + '台</span>' +
        '<span class="prob">推定 ' + (c.est_prob * 100).toFixed(1) + '%</span></div>';
      (c.reasons || []).forEach(r => {
        const w = r.effect_pp > 0 ? Math.min(r.effect_pp / 3 * 100, 100) : 0;
        h += '<div class="bar"><span class="lbl">' + esc(r.label) + '（' + (r.bucket+1) + '/' + r.n_buckets + '段階）</span>' +
          '<span class="tr"><span class="fl" style="width:' + w + '%"></span></span>' +
          '<span class="vl ' + cls(r.effect_pp) + '">' + pp(r.effect_pp) + 'pt</span></div>';
      });
      h += '</div>';
    });
    h += '<p class="note">「全台系が入る確率」であって「その台で勝てる確率」ではありません。' +
      '全台系の日は1台あたりの差枚が平均+2,047枚変わります。</p>';
  }
  return h + '</div>';
}

function renderCalendar(rows){
  let h = '<div class="card"><h2>日付の癖 <span class="sub">約6,000通りを検定しFDR10%を通過したものだけ</span></h2>';
  if (!rows || !rows.length) h += '<p class="empty">この店では、日付と連動した癖は検出されていません。</p>';
  else {
    h += '<table><tr><th class="l">指標</th><th class="l">条件</th><th>普段との差</th><th>z</th><th>件数</th></tr>';
    rows.forEach(r => {
      h += '<tr><td class="l">' + esc(r.metric_label) + '</td><td class="l">' + esc(r.label) + '</td>' +
        '<td class="' + cls(r.effect_pp) + '">' + pp(r.effect_pp) + 'pt</td>' +
        '<td class="dim">' + Number(r.z).toFixed(1) + '</td><td class="dim">' + r.n + '</td></tr>';
    });
    h += '</table>';
  }
  return h + '</div>';
}

function renderPlacement(pl){
  let h = '<div class="card"><h2>配置の癖 <span class="sub">ホールで実際のデータを見ながら使う材料</span></h2>';
  const keys = DATA.pattern_order.filter(k => pl && pl[k]);
  if (!keys.length) h += '<p class="empty">まだ計算されていません。</p>';
  else {
    h += '<table><tr><th class="l">パターン</th><th>偶然との差</th><th>z</th><th>件数</th><th>判定</th></tr>';
    keys.forEach(k => {
      const p = pl[k];
      const val = (k === 'tail_all') ? (1 + p.effect_pp / 100).toFixed(2) + '倍' : pp(p.effect_pp) + 'pt';
      h += '<tr><td class="l">' + esc(p.label) + '</td>' +
        '<td class="' + cls(p.effect_pp) + '">' + val + '</td>' +
        '<td class="dim">' + Number(p.z).toFixed(1) + '</td><td class="dim">' + p.n + '</td>' +
        '<td>' + (p.significant ? '<span class="badge sig">有意</span>' : '<span class="badge dim">—</span>') + '</td></tr>';
    });
    h += '</table><p class="note">「機種全台」が有意なら、その機種の1台が良ければ他も期待できます。' +
      '「末尾全台」は台番号の末尾で揃う度合い（倍率）。「ひとつ飛ばし」が有意なら良い台の2つ隣を見る価値があります。' +
      '「塊」は全店的に成立していないので、プラスが3台続いていても根拠にはなりません。</p>';
  }
  return h + '</div>';
}

function renderSummary(sum){

// ---- ヒートマップ（店×日付×癖）----
// 2026-09-06、masaharuさんの「店×日付×癖をヒートマップで表したい。
// 切り替えできるようにしたい」への対応。指標（好調台/凹み台/機種全台/…）
// を上のチップで切り替え、その指標だけの店×日付グリッドを出す。
//
// 2026-09-19、masaharuさんの「これじゃ何も分からん」への対応で基準変更。
// 以前は「色が付くのはFDR検定を通ったセルだけ」だったが、FDRは店×指標×
// 切り口で数千通りを一括補正するため、通るのは全体で数セルしかなく、
// ヒートマップがほぼ真っ白になっていた。同じページの他の場所（今日の
// シグナル・今日の該当台）は既に「確定(FDR)+仮説(z>=1.0)」を両方見せる
// 方針に変わっている（get_signals_for_date参照）ので、ヒートマップも
// 揃える。cell.shown が確定+仮説の表示対象、cell.significant が
// そのうち確定（FDR通過）かどうか。仮説は色を薄く・数字に*を付けて
// 見分けられるようにする（隠さないが、確度は落として見せる）。
let heatMetric = null;
let heatAll = false;

// 2026-09-22: masaharuさんの「今日行く（夜ならもう明日行く）店を見つける
// ところがスタート」への対応。そもそもの起点は「今日（夜は翌日）」なので、
// ヒートマップ・癖マトリクスどちらでも、実際に行く対象の日の列を強調する。
// 「夜」の閾値は21時固定（変えたい場合はここを直す）。
const NIGHT_HOUR = 21;
function getTargetDateInfo(){
  const now = new Date();
  const t = new Date(now);
  const isTomorrow = now.getHours() >= NIGHT_HOUR;
  if (isTomorrow) t.setDate(t.getDate() + 1);
  const day = t.getDate();
  const lastDay = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return {
    day,
    digit: day % 10,
    weekday: (t.getDay() + 6) % 7, // 月=0…日=6（calendar_scan.pyのdate.weekday()と合わせる）
    isMonthEnd: (lastDay - day) <= 2,
    isZoro: day === 11 || day === 22,
    isMdZoro: (t.getMonth() + 1) === day,
    isTomorrow,
  };
}
const TARGET = getTargetDateInfo();
// isExtended（1〜31日／◯のつく日／月末の3グループ入り軸）・単純な日付軸・
// 曜日軸のどれでも、そのキーが「今日（夜は明日）」に該当するかを判定する。
function isTargetKey(k, isExtended, isDayAxis){
  if (isExtended) {
    const g = dayKeyGroup(k);
    if (g === 'day') return k === TARGET.day;
    if (g === 'digit') return (k - 100) === TARGET.digit;
    if (k === 210) return TARGET.isZoro;
    if (k === 220) return TARGET.isMdZoro;
    return TARGET.isMonthEnd; // 'monthend'
  }
  return isDayAxis ? (k === TARGET.day) : (k === TARGET.weekday);
}

function heatColor(cell){
  if (!cell || cell.effect_pp == null || !cell.shown) {
    return (cell && cell.effect_pp != null) ? '#f1f5f9' : '#fafbfc';
  }
  const v = Math.max(-12, Math.min(12, cell.effect_pp));
  const t = Math.min(Math.abs(v) / 12, 1);
  // 確定(significant)は濃く、仮説（zの床だけ超えたもの）は薄く塗る。
  // 2026-09-19、masaharuさんの「プラスの有意ほど濃い緑、マイナスの有意
  // ほど濃い赤にできる？」への対応。プラス=緑(var(--pos))、マイナス=
  // 赤(var(--neg))に変更（それまでは上振れ=オレンジ/下振れ=青だった）。
  const a0 = cell.significant ? 0.16 : 0.08;
  const span = cell.significant ? 0.70 : 0.38;
  return v >= 0 ? `rgba(22,163,74,${(a0 + t * span).toFixed(2)})`   /* 緑=プラス */
                : `rgba(220,38,38,${(a0 + t * span).toFixed(2)})`;  /* 赤=マイナス */
}

function renderHeatGrid(){
  const H = DATA.heatmap || {};
  const cells = (H.cells || {})[heatMetric] || {};
  const sigStore = (H.sig_store || {})[heatMetric] || {};
  // その指標で有意なセルが1つでもある店を上に、無い店は下にまとめる
  // （どの店を見ればいいか一目で分かるように）。同点はあいうえお順。
  let stores = (H.stores || []).slice().sort((a, b) =>
    (sigStore[b] || 0) - (sigStore[a] || 0) || a.localeCompare(b, 'ja'));

  // 2026-09-17: 有意セルは全体の1〜3%しかないため、全22店を出すと
  // 「ほぼ真っ白な表」になってしまう。既定では有意セルを持つ店だけに絞り、
  // 全件は heatAll トグルで出す。
  const nSig = stores.filter(s => (sigStore[s] || 0) > 0).length;
  const hidden = stores.length - nSig;
  if (!heatAll && nSig > 0) stores = stores.filter(s => (sigStore[s] || 0) > 0);

  if (!nSig) {
    return '<div class="heat-empty">この軸は、1〜31日のどの日付にも' +
      '<b>確定(FDR)・仮説(z&ge;1.0)のどちらの偏りもありません</b>。<br>' +
      '「この店のこの日は普段と違う」と言える日が無い、という結果です。' +
      '<br><span class="dim">※ 測定はしています。日付ではなく曜日や配置で出る癖かもしれません。</span></div>';
  }

  const days = H.days || [];
  // 日付軸は31列あって数字を全部出すと潰れるため、5日おきだけラベルを出し、
  // 5日ごとに縦罫線を入れて目盛りが読めるようにする。
  // 2026-09-22: 「今日（夜は明日）」の列は、5日おきでなくても必ずラベルを出す。
  const isLabel = d => (d === 1 || d % 5 === 0 || d === TARGET.day);
  let h = '<div class="heat-wrap"><table class="heat"><thead><tr><th class="hs">店舗</th>' +
    days.map(d => `<th class="${d % 5 === 1 && d !== 1 ? 'd5 ' : ''}${isLabel(d) ? 'dl' : ''}` +
      `${d === TARGET.day ? ' today' : ''}">` +
      (isLabel(d) ? d : '') + '</th>').join('') + '</tr></thead><tbody>';
  stores.forEach(store => {
    h += '<tr><td class="hs" title="' + esc(store) + '">' + esc(store) + '</td>';
    days.forEach(d => {
      const c = (cells[store] || {})[d];
      const bg = heatColor(c);
      const txt = (c && c.shown) ? (Math.round(c.effect_pp) + (c.significant ? '' : '*')) : '';
      const title = c
        ? `${store} ${d}日: 普段より${pp(c.effect_pp, 1)}pt（z=${Number(c.z).toFixed(1)}・${c.n}日）` +
          (c.significant ? '（確定）' : c.shown ? '（仮説・*付き数字）' : '（zが小さく、判断材料にも届きません）')
        : `${store} ${d}日: データ不足`;
      h += `<td class="hc${d % 5 === 1 && d !== 1 ? ' d5' : ''}${d === TARGET.day ? ' today' : ''}" ` +
        `style="background:${bg}" title="${esc(title)}">${txt}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if (hidden > 0) {
    h += '<label class="heat-toggle"><input type="checkbox" id="heatAll"' +
      (heatAll ? ' checked' : '') + '> 確定/仮説どちらも無い店も表示する（' + hidden + '店）</label>';
  }
  return h;
}

function renderHeatmap(){
  const H = DATA.heatmap || {};
  const metrics = H.metrics || [];
  const sigM = H.sig_metric || {};
  // 既定は「有意セルが一番多い軸」。metrics は生成側で件数降順に並べてある。
  if (!heatMetric || metrics.indexOf(heatMetric) === -1) {
    heatMetric = metrics.find(m => (sigM[m] || 0) > 0) || metrics[0];
  }
  if (!metrics.length) {
    return '<div class="card"><h2>店×日付×癖のヒートマップ</h2><p class="empty">まだ計算されていません。</p></div>';
  }
  let h = '<div class="card"><h2>店×日付×癖のヒートマップ ' +
    '<span class="sub">濃色=確定(FDR) ／ 薄色=仮説(z&ge;1.0、判断材料程度)</span>' +
    `<span class="today-note">${TARGET.isTomorrow ? '明日' : '今日'}（${TARGET.day}日）を強調表示</span></h2>`;
  h += '<div class="mchips">' + metrics.map(m => {
    const n = sigM[m] || 0;
    return `<button data-m="${m}" class="${m === heatMetric ? 'on ' : ''}${n ? '' : 'off'}" ` +
      `title="${n ? n + '個のセルが確定/仮説' : '該当セルなし（日付の癖としては検出されていません）'}">` +
      `${esc(H.metric_labels[m])}<span class="cnt">${n}</span></button>`;
  }).join('') + '</div>';
  h += '<div id="heatgrid">' + renderHeatGrid() + '</div>';
  h += '<div class="heat-legend">' +
    '<span class="sw" style="background:rgba(220,38,38,.75)"></span>強く下振れ(確定)' +
    '<span class="sw" style="background:rgba(220,38,38,.25)"></span>やや下振れ/仮説' +
    '<span class="sw" style="background:#f1f5f9"></span>差なし/データ薄い' +
    '<span class="sw" style="background:rgba(22,163,74,.25)"></span>やや上振れ/仮説' +
    '<span class="sw" style="background:rgba(22,163,74,.75)"></span>強く上振れ(確定)</div>';
  h += '<p class="note">数字は「普段のその店・その指標との差」（pt）。末尾に*が付く数字は仮説層' +
    '（FDRは通っていないがz&ge;1.0で、完全にゼロとは区別が付くという最低ライン、現地確認前提の判断材料）です。' +
    'チップの数字は、その軸で確定/仮説いずれかに該当したセルの数です（0なら日付の癖としては出ていない軸）。' +
    '日付の目盛りは5日おき、縦罫線も5日区切りです。' +
    '1〜31日の切り口なので、31日が無い月がある分だけ月末のセルは件数が少なくなります。' +
    `枠で囲った列は「${TARGET.isTomorrow ? '明日' : '今日'}（${TARGET.day}日）」です` +
    '（21時以降は、もう明日行く店を探しているはずなので自動で翌日にずらします）。</p>';
  return h + '</div>';
}

function bindHeatChips(){
  document.querySelectorAll('.mchips button').forEach(btn => {
    btn.addEventListener('click', () => {
      heatMetric = btn.dataset.m;
      document.querySelectorAll('.mchips button').forEach(b => b.classList.toggle('on', b === btn));
      redrawHeatGrid();
    });
  });
}

// グリッドは「有意なセルが無い店も表示する」チェックボックスを内側に持つので、
// 描き直すたびに再バインドする。
function redrawHeatGrid(){
  const box = document.getElementById('heatgrid');
  if (!box) return;
  box.innerHTML = renderHeatGrid();
  const all = document.getElementById('heatAll');
  if (all) all.addEventListener('change', () => { heatAll = all.checked; redrawHeatGrid(); });
}

// ---- 癖マトリクス（店を1つ選んで、指標×日付／指標×曜日を一望）----
// 2026-09-19、masaharuさんの「仮説含めて、洗い出された全ての癖を
// マトリクス(日付マトリクス、曜日マトリクス)で、店ごとにレポートして」
// への対応。ヒートマップ（指標を1つ選んで店を並べる）とは軸を入れ替え、
// 店を1つ選んで7指標を縦に並べる。色付けの考え方（確定=濃色／仮説=薄色）
// はヒートマップと共通なので heatColor() をそのまま使う。
const WEEKDAY_JP_ARR = ['月', '火', '水', '木', '金', '土', '日'];

// 2026-09-21: masaharuさんの「癖マトリクスでは日付の特異日なしとなってる
// けど、今日の該当台のほうは1日が特異日になってる。なんでだっけ？」への
// 対応。日付マトリクスの列に「◯のつく日」（100+d、d=0〜9）と「月末」
// （200固定）を追加したので、キーの値でどのグループかを判定するヘルパー。
// keys.length>10 の「日付系」マトリクスにのみ現れる値域（1〜31・
// 100〜109・200）で、曜日マトリクス（0〜6）や、まだ拡張していない
// 店×機種タブの日付マトリクス（1〜31のみ）には影響しない。
function dayKeyGroup(k){
  if (k >= 100 && k <= 109) return 'digit';
  if (k === 200 || k === 210 || k === 220) return 'monthend';   // 特定日（月末・ゾロ目日・月ゾロ）
  return 'day';
}
function dayKeyHeader(k){
  if (k >= 100 && k <= 109) return String(k - 100);
  if (k === 200) return '月末';
  if (k === 210) return 'ゾロ';
  if (k === 220) return '月ゾロ';
  return String(k);
}
function dayKeyLabel(k){
  if (k >= 100 && k <= 109) return (k - 100) + 'の付く日';
  if (k === 200) return '月末3日間';
  if (k === 210) return 'ゾロ目日（11・22日）';
  if (k === 220) return '月ゾロ（月と日が同じ日）';
  return k + '日';
}

function renderMatrixGrid(axis){
  if (!axis || !axis.n_shown) {
    return '<p class="empty">この軸では、確定・仮説含めて洗い出された癖がありません' +
      '（測定はしていますが、偶然と見分けが付くほどの偏りが無かったという結果です）。</p>';
  }
  const metrics = axis.metrics || [];
  const keys = axis.keys || [];
  const isDay = keys.length > 10;
  const isExtended = isDay && keys.some(k => k >= 100);

  let thead;
  if (isExtended) {
    // 「1〜31日」「◯のつく日」「月末」の3グループを、上段の見出し行＋
    // 下段の個別ラベル行の2段ヘッダーで見せる（グループの境目に太い罫線）。
    const GROUP_LABELS = { day: '日付(1〜31日)', digit: '◯のつく日', monthend: '特定日' };
    const groups = [];
    keys.forEach(k => {
      const g = dayKeyGroup(k);
      if (!groups.length || groups[groups.length - 1].g !== g) groups.push({ g, n: 0 });
      groups[groups.length - 1].n++;
    });
    const groupRow = '<tr><th class="hs" rowspan="2">指標</th>' +
      groups.map(gr => `<th colspan="${gr.n}" class="grp">${GROUP_LABELS[gr.g]}</th>`).join('') + '</tr>';
    const labelRow = '<tr>' + keys.map((k, i) => {
      const isGroupStart = i > 0 && dayKeyGroup(keys[i - 1]) !== dayKeyGroup(k);
      const isFive = dayKeyGroup(k) === 'day' && k % 5 === 1 && k !== 1;
      const todayCls = isTargetKey(k, true, false) ? ' today' : '';
      return `<th class="dl${isGroupStart ? ' gd' : (isFive ? ' d5' : '')}${todayCls}">${dayKeyHeader(k)}</th>`;
    }).join('') + '</tr>';
    thead = '<thead>' + groupRow + labelRow + '</thead>';
  } else {
    // 2026-09-20: ヒートマップは店が22行あるので5日おきだけラベルを出して
    // いたが、マトリクスは7指標しか無く縦に余裕があるので、全ての日付に
    // ラベルを付ける（「どの列が何日か分からない」への対応）。
    thead = '<thead><tr><th class="hs">指標</th>' +
      keys.map(k => {
        const todayCls = isTargetKey(k, false, isDay) ? ' today' : '';
        return isDay
          ? `<th class="dl${k % 5 === 1 && k !== 1 ? ' d5' : ''}${todayCls}">${k}</th>`
          : `<th class="dl${todayCls}">${WEEKDAY_JP_ARR[k]}</th>`;
      }).join('') + '</tr></thead>';
  }

  let h = '<div class="heat-wrap"><table class="heat mx">' + thead + '<tbody>';
  metrics.forEach(m => {
    const row = (axis.cells || {})[m] || {};
    h += '<tr><td class="hs">' + esc(axis.metric_labels[m]) + '</td>';
    keys.forEach((k, i) => {
      const c = row[String(k)];
      const bg = heatColor(c);
      const txt = c ? (Math.round(c.effect_pp) + (c.significant ? '' : '*')) : '';
      const keyLabel = isExtended ? dayKeyLabel(k) : (isDay ? (k + '日') : (WEEKDAY_JP_ARR[k] + '曜'));
      const title = c
        ? `${esc(axis.metric_labels[m])} ${keyLabel}: 普段より${pp(c.effect_pp, 1)}pt` +
          `（z=${Number(c.z).toFixed(1)}${c.days_text ? '・' + esc(c.days_text) : ''}）` +
          (c.significant ? '（確定）' : '（仮説）')
        : '';
      let divCls = '';
      if (isExtended) {
        const isGroupStart = i > 0 && dayKeyGroup(keys[i - 1]) !== dayKeyGroup(k);
        const isFive = dayKeyGroup(k) === 'day' && k % 5 === 1 && k !== 1;
        divCls = isGroupStart ? ' gd' : (isFive ? ' d5' : '');
      } else if (isDay && k % 5 === 1 && k !== 1) {
        divCls = ' d5';
      }
      // 2026-09-22: 「今日（夜は明日）」に該当する列は、指標を問わず全行に付ける。
      if (isTargetKey(k, isExtended, isDay)) divCls += ' today';
      // 2026-09-21: 「◯のつく日」「月末」は複数の暦日をまとめたセルなので、
      // タップすると実際のカレンダー日ごとの内訳（breakdown）を出す。
      // data属性はencodeURIComponentで安全にエスケープしてから埋め込む
      // （引用符や記号がJSON内に混ざっても属性値が壊れないように）。
      let bdCls = '', bdAttr = '';
      if (c && c.breakdown && c.breakdown.length) {
        bdCls = ' hc-bd';
        const payload = {
          metric: axis.metric_labels[m], keyLabel, z: c.z,
          effect_pp: c.effect_pp, significant: c.significant,
          days_text: c.days_text, breakdown: c.breakdown,
        };
        bdAttr = ` data-bd="${encodeURIComponent(JSON.stringify(payload))}"`;
      }
      h += `<td class="hc${divCls}${bdCls}" style="background:${bg}" ` +
        `title="${esc(title)}"${bdAttr}>${txt}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}

// 2026-09-21: 「◯のつく日」「月末」セルをタップしたときの内訳パネル。
// #body はタブ切り替えのたびに innerHTML ごと差し替わるので、個々のセルに
// クリックハンドラを付け直すのではなく、#body 自体に1回だけ委譲登録する。
const mxBdPanel = document.getElementById('mxBdPanel');

function hideBreakdownPanel(){
  mxBdPanel.classList.remove('show');
  mxBdPanel.innerHTML = '';
}

function showBreakdownPanel(payload){
  const rows = (payload.breakdown || []).slice().sort((a, b) => a.day - b.day);
  const bodyRows = rows.map(b => {
    const cls = b.effect_pp > 0 ? 'pos' : (b.effect_pp < 0 ? 'neg' : '');
    return `<tr><td>${b.day}日</td><td>${b.n}日中${b.pos}日プラス</td>` +
      `<td class="${cls}">${pp(b.effect_pp, 1)}pt</td></tr>`;
  }).join('');
  mxBdPanel.innerHTML =
    '<span class="mx-bd-close" id="mxBdClose">&times;</span>' +

function renderPickList(picks){
  return picks.map(p => {

    const cd = p.cond_n

        (p.cond_plus_rate*100).toFixed(0) + '% ／ 平均 ' + pp(p.cond_avg_diff,0) + '枚</div>'
      : '';
    // 2026-09-21: 理由が「hekomi/hot」以外（席の癖・全台系だけ）でも、

    // データ更新が遅れている（前日データ未着）ときは⚠付きで示し、

    const lag = p.data_lag_days || 0;

      ? '<span class="src" style="background:#fef3c7;color:#92400e" title="前日データが未更新のため' +
        lag + '日前のデータから推定した連続日数です">⚠推定(' + lag + '日遅れ)</span>' : '';
    const streakBadge = (p.hekomi_streak > 0 || p.age_streak > 0)
      ? '<span class="sc" style="margin-left:0">' +
        (p.hekomi_streak > 0 ? '凹み' + p.hekomi_streak + '日' : '好調' + p.age_streak + '日') +
        '</span>' : '';
    // 2026-09-26、masaharuさんの「ランキングには乗ってるスコアが、

    // 算出済み（一番強い理由のzに、系統数・地力のボーナスを足したもの。
    // pkSort=scoreの並び順にも使っている値）を、そのままバッジ表示する。
    const scoreBadge = (p.score != null)
      ? '<span class="sc score-badge">スコア ' + Number(p.score).toFixed(1) + '</span>' : '';
    return '<div class="pk' + (p.n_sources >= 3 ? ' hot3' : '') + '"><div class="hd">' +
      '<span class="mno">' + p.machine + '番</span>' +
      '<span class="mdl">' + esc(p.model || '') + '</span>' + streakBadge + lagTag + ml + scoreBadge +
      '<span class="sc">理由' + p.reasons.length + '件 / ' + p.n_sources + '系統</span></div>' + cd +
      '<ul>' + p.reasons.map(r =>
        // 2026-09-21: ここが SRC_LABELS を経由せず r.source の生タグ（"zentai"等の
        // 内部名）をそのまま出していたため、calendar_scan側の「機種全台」と
        // zentai_predictor側の「全台系候補」が別ロジックだと伝わらず、

        '<li><span class="src">' + esc(SRC_LABELS[r.source] || r.source) + '</span>' + esc(r.text) + '</li>').join('') +

// ---- 今日の該当台（絞り込み付き）----
// 2026-09-13、masaharuさんの「店と台など、検索条件がなくてたどり着けない」
// への対応。287台を店ごとに12台ずつ並べるだけだったので、
// 店・台番号/機種名・理由の系統で絞れるようにした。
// 入力のたびに全体を描き直すとテキスト欄のフォーカスが外れるので、
// 操作部分は据え置いてリスト（#pkbody）だけを描き直す。
const PK = { store: '', q: '', src: '', sort: 'score', limit: 50 };
const SRC_LABELS = { seat: '席の癖', calendar: '日付の癖', zentai: '全台系', streak: '凹み特異日' };

function pkStores(){
  return DATA.store_names.filter(s => ((DATA.stores[s] || {}).picks || []).length);
}

function pkRows(){
  const q = PK.q.trim().toLowerCase();
  const out = [];
  pkStores().forEach(st => {
    if (PK.store && st !== PK.store) return;
    (DATA.stores[st].picks || []).forEach(p => {
      if (PK.src && p.sources.indexOf(PK.src) === -1) return;
      if (q) {
        const hay = (String(p.machine) + ' ' + (p.model || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      out.push(Object.assign({ store: st }, p));
    });
  });
  // 2026-09-21: 「理由の強さ順」は today_picks.build_picks 側で既に score
  // （＝癖マトリクスと同じ、一番強い1つの理由のz。複数理由・地力は僅かな
  // ボーナス止まり）として計算済みなので、ここではそれをそのまま使う
  // （以前は表示側でも n_sources を最優先にしてしまっていて、二重に
  // 「理由が多い台」を優先する結果になっていた）。
  out.sort(PK.sort === 'machine'
    ? (a, b) => (a.store === b.store ? a.machine - b.machine : a.store.localeCompare(b.store, 'ja'))
    : (a, b) => (b.score - a.score));
  return out;
}

function renderPicksBody(){
  const rows = pkRows();
  const shown = PK.limit ? rows.slice(0, PK.limit) : rows;
  let h = '<div class="muted" style="margin:2px 0 10px">' + rows.length + '台が条件に一致'
        + (shown.length < rows.length ? '（上位' + shown.length + '台を表示）' : '') + '</div>';
  if (!rows.length) {
    return h + '<div class="card"><p class="empty">条件に合う台がありません。'
      + '絞り込みを外すか、別の店を選んでください。</p></div>';
  }
  let cur = null;
  shown.forEach(p => {
    if (p.store !== cur) {
      cur = p.store;
      const d = DATA.stores[cur];
      h += '<div class="storehd">' + esc(cur) + '<span class="sg">' +
        esc((d.today_signals || []).map(x => x.label + '：' + x.metric_label).join(' / ')) +
        '</span></div>';
    }
    h += renderPickList([p]);
  });
  if (shown.length < rows.length)
    h += '<p class="note">残り ' + (rows.length - shown.length) + '台。'
       + '「表示件数」を増やすか、店で絞ってください。</p>';
  return h;
}

function renderAccuracyBox(){
  // 2026-09-26、masaharuさんの「過去予想の精度を保存＋見える化」への対応。
  // 実績と答え合わせできた日数が溜まるまではacc=nullなので、その間は

  const acc = DATA.picks_accuracy;
  if (!acc) {
    return '<div class="card acc-box"><p class="muted" style="margin:0">' +
      '📈 的中率を集計中です（実績データが揃い次第、ここに表示されます）。</p></div>';
  }
  const pct = Math.round(acc.hit_rate * 1000) / 10;
  const diffTxt = (acc.avg_actual_diff >= 0 ? '+' : '') + Math.round(acc.avg_actual_diff) + '枚';
  return '<div class="card acc-box"><p style="margin:0">' +
    '📈 直近' + acc.days_counted + '日の的中率: <b>' + pct + '%</b>' +
    '（該当台' + acc.n_picks + '件中、実際の差枚がプラスだった台の割合／平均実績 ' + diffTxt + '）' +
    '</p><p class="note" style="margin:4px 0 0">' +
    acc.date_from + '〜' + acc.date_to + 'の実績で答え合わせ済み。「的中」＝その台の実際の差枚がプラスだったかどうかです。' +
    '</p></div>';
}

function bindPicks(){
  const upd = () => { document.getElementById('pkbody').innerHTML = renderPicksBody(); };

  const li = document.getElementById('pkLimit');
  if (st) st.addEventListener('change', () => { PK.store = st.value; upd(); });
  if (q) q.addEventListener('input', () => { PK.q = q.value; upd(); });
  if (so) so.addEventListener('change', () => { PK.sort = so.value; upd(); });
  if (li) li.addEventListener('change', () => { PK.limit = +li.value; upd(); });
  document.querySelectorAll('#pkSrc button').forEach(b => {
    b.addEventListener('click', () => {
      PK.src = b.dataset.s;
      document.querySelectorAll('#pkSrc button').forEach(x => x.classList.toggle('on', x === b));
      upd();
    });
  });
}

// ---- 店×日付カレンダー（2026-10-05）----
// 縦=店、横=対象日（今日。18時以降の生成なら翌日）から31日。各セルには、その店のその日に
// 当てはまる癖（◯日・◯のつく日・曜日・月末3日間、席の癖も含む）を癖マトリクスと同じ基準
// （確定=FDR通過、仮説=z>=1.0）で集め、効果(pt)を合計した値を出す（仮説は半分の重み）。
// 緑=プラス（その日は出やすい）、赤=マイナス。濃い色=確定を含む。セルをタップで中身。
let calSort = 'today', calSigOnly = false, calSeat = true, calOnlyAny = true;
let CAL = null;
const WD_JP = ['月','火','水','木','金','土','日'];

function calDates(){
  const base = new Date(DATA.target_date + 'T00:00:00');
  const out = [];
  for (let i = 0; i < 31; i++) {
    const t = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    const day = t.getDate();
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    out.push({ m: t.getMonth() + 1, day, digit: day % 10, wd: (t.getDay() + 6) % 7,
               monthEnd: (last - day) <= 2 });
  }
  return out;
}

function calItems(store, d){
  const mx = ((DATA.stores || {})[store] || {}).matrix || {};
  const items = [];
  const add = (axis, key, label) => {
    const A = mx[axis];
    if (!A) return;
    Object.entries(A.cells || {}).forEach(([m, byKey]) => {
      if (!calSeat && m.indexOf('seat:') === 0) return;
      const c = (byKey || {})[String(key)];
      if (!c || !c.shown || c.effect_pp == null) return;
      if (calSigOnly && !c.significant) return;
      items.push(Object.assign({ metric: (A.metric_labels || {})[m] || m, keyLabel: label }, c));
    });
  };
  add('day', d.day, d.day + '日');
  add('day', 100 + d.digit, d.digit + 'のつく日');
  if (d.monthEnd) add('day', 200, '月末3日間');
  if (d.day === 11 || d.day === 22) add('day', 210, 'ゾロ目日');
  if (d.m === d.day) add('day', 220, '月ゾロ');
  add('weekday', d.wd, WD_JP[d.wd] + '曜日');
  items.sort((a, b) => Math.abs(b.z || 0) - Math.abs(a.z || 0));
  return items;
}

function calScore(items){
  let s = 0, sig = false;
  items.forEach(i => { s += i.effect_pp * (i.significant ? 1 : 0.5); if (i.significant) sig = true; });
  return { s, sig };
}

function calColor(sc, n){
  if (!n) return '#fafbfc';
  const v = Math.max(-15, Math.min(15, sc.s));
  const t = Math.abs(v) / 15;
  const a0 = sc.sig ? 0.16 : 0.08, span = sc.sig ? 0.70 : 0.38;
  return v >= 0 ? `rgba(22,163,74,${(a0 + t * span).toFixed(2)})`
                : `rgba(220,38,38,${(a0 + t * span).toFixed(2)})`;
}

function renderCal(){
  const dates = calDates();
  const names = (DATA.store_names || []).filter(s => (DATA.stores || {})[s]);
  let rows = names.map(s => {
    const cells = dates.map(d => { const it = calItems(s, d); return { it, sc: calScore(it) }; });
    return { s, cells,
             total: cells.reduce((a, c) => a + Math.max(0, c.sc.s), 0),
             nAny: cells.filter(c => c.it.length).length };
  });
  const hidden = rows.filter(r => !r.nAny).length;
  if (calOnlyAny) rows = rows.filter(r => r.nAny);
  // 今日が熱い順（既定）: 起点日（今日。18時以降の生成なら明日）のスコアが高い店が上。
  // 同点なら1か月の合計で並べる。1か月の合計順: 31日間のプラス分の合計。
  if (calSort === 'today') rows.sort((a, b) => b.cells[0].sc.s - a.cells[0].sc.s || b.total - a.total || a.s.localeCompare(b.s, 'ja'));
  else if (calSort === 'month') rows.sort((a, b) => b.total - a.total || a.s.localeCompare(b.s, 'ja'));
  else rows.sort((a, b) => a.s.localeCompare(b.s, 'ja'));
  CAL = { dates, rows };

  const chip = (id, on, label) => `<button id="${id}" class="${on ? 'on' : ''}">${label}</button>`;
  let h = '<div class="card"><h2>店×日付 <span class="sub">今日から31日間、どの店のどの日に癖が当たるか</span></h2>' +
    '<div class="mchips">' +
      chip('calSortToday', calSort === 'today', (dates[0] ? dates[0].m + '/' + dates[0].day : '今日') + 'が熱い順') +
      chip('calSortMonth', calSort === 'month', '1か月の合計順') + chip('calSortName', calSort === 'name', '店名順') +
      chip('calSig', calSigOnly, '確定のみ') + chip('calSeat', calSeat, '席の癖も含める') +
      chip('calAny', !calOnlyAny, '癖なしの店も表示' + (hidden ? '（' + hidden + '店）' : '')) +
    '</div>';
  if (!rows.length) {
    h += '<div class="heat-empty">この条件で当てはまる癖のある店がありません。</div></div>';
    return h;
  }
  h += '<div class="heat-wrap"><table class="heat cal"><thead><tr><th class="hs">店舗</th>';
  dates.forEach((d, i) => {
    const mon1 = (i > 0 && d.day === 1) ? ' mon1' : '';
    h += `<th class="dl${i === 0 ? ' today' : ''}${mon1}">` + ((i === 0 || d.day === 1) ? d.m + '/' + d.day : d.day) + '</th>';
  });
  h += '</tr><tr><th class="hs"></th>';
  dates.forEach((d, i) => {
    const wc = d.wd === 5 ? ' sat' : (d.wd === 6 ? ' sun' : '');
    const mon1 = (i > 0 && d.day === 1) ? ' mon1' : '';
    h += `<th class="wd${wc}${i === 0 ? ' today' : ''}${mon1}">${WD_JP[d.wd]}</th>`;
  });
  h += '</tr></thead><tbody>';
  rows.forEach((r, ri) => {
    h += '<tr><td class="hs" title="' + esc(r.s) + '">' + esc(r.s) + '</td>';
    r.cells.forEach((c, ci) => {
      const n = c.it.length;
      const txt = n ? (Math.round(c.sc.s) + (c.sc.sig ? '' : '*')) : '';
      const mon1 = (ci > 0 && dates[ci].day === 1) ? ' mon1' : '';
      h += `<td class="hc cal-c${n ? ' has' : ''}${ci === 0 ? ' today' : ''}${mon1}" data-r="${ri}" data-c="${ci}" ` +
        `style="background:${calColor(c.sc, n)}">${txt}</td>`;
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  h += '<div class="heat-legend"><span class="sw" style="background:rgba(22,163,74,.75)"></span>プラス（確定を含む）' +
    '<span class="sw" style="background:rgba(22,163,74,.3)"></span>プラス（仮説のみ・数字に*）' +
    '<span class="sw" style="background:rgba(220,38,38,.6)"></span>マイナス' +
    '<span class="sw" style="background:#fafbfc;border:1px solid #e2e8f0"></span>特異日なし</div>' +
    '<p class="note">数字＝その日に当てはまる癖の効果（普段比pt）の合計（仮説は半分の重み）。' +
    '◯日・◯のつく日・曜日・月末3日間の癖（席の癖も含む）を、癖マトリクスと同じ基準（確定＝FDR通過／仮説＝z≧1.0）で集めています。' +
    'セルをタップすると中身が見られます。<br>「' + (dates[0] ? dates[0].m + '/' + dates[0].day : '今日') + 'が熱い順」＝一番左の日（今日。18時以降に作られたページは明日）のスコアが高い店が上。' +
    '「1か月の合計順」＝31日間のプラス分の合計が大きい店が上（強い日が多い店）。スコアは高いほど、その日は普段より出やすい傾向です。</p></div>';
  return h;
}

function showCalPanel(ri, ci){
  if (!CAL) return;
  const r = CAL.rows[ri], d = CAL.dates[ci];
  if (!r || !d) return;
  const c = r.cells[ci];
  let body;
  if (!c.it.length) body = '<p class="empty">この日は、この店の特異日に当たっていません（普段どおりの日）。</p>';
  else body = c.it.map(i =>
    '<div class="cal-item">' + (i.significant ? '<span class="badge sig">確定</span>' : '<span class="badge dim">仮説</span>') +
    ' <b>' + esc(i.keyLabel) + '</b> — ' + esc(i.metric) + 'が普段より ' +
    `<span class="${i.effect_pp >= 0 ? 'pos' : 'neg'}">${pp(i.effect_pp, 1)}pt</span>` +
    '（z=' + Number(i.z).toFixed(1) + (i.n ? '・' + i.n + '件' : '') + '）' +
    (i.days_text ? ' <span class="dim">' + esc(i.days_text) + '</span>' : '') + '</div>').join('');
  mxBdPanel.innerHTML =
    '<span class="mx-bd-close" id="mxBdClose">&times;</span>' +
    `<h4>${esc(r.s)} ／ ${d.m}/${d.day}（${WD_JP[d.wd]}）</h4>` +
    (c.it.length ? `<div class="dim" style="font-size:11.5px">合計 ${pp(c.sc.s, 1)}pt（仮説は半分の重み）</div>` : '') +
    body +
    '<span class="cal-go" id="calGo">この店の癖マトリクスを見る</span>';
  mxBdPanel.classList.add('show');
  document.getElementById('mxBdClose').addEventListener('click', hideBreakdownPanel);
  document.getElementById('calGo').addEventListener('click', () => {
    hideBreakdownPanel();
    sel.value = r.s;
    showMatrix();
    window.scrollTo(0, 0);
  });
}

function bindCal(){
  const re = () => { document.getElementById('body').innerHTML = renderCal(); bindCal(); };
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', () => { fn(); re(); }); };
  on('calSortToday', () => { calSort = 'today'; });
  on('calSortMonth', () => { calSort = 'month'; });
  on('calSortName', () => { calSort = 'name'; });
  on('calSig', () => { calSigOnly = !calSigOnly; });
  on('calSeat', () => { calSeat = !calSeat; });
  on('calAny', () => { calOnlyAny = !calOnlyAny; });
}

document.getElementById('body').addEventListener('click', (e) => {
  const td = e.target.closest('td.cal-c');
  if (!td) return;
  showCalPanel(Number(td.dataset.r), Number(td.dataset.c));
});

// 2026-09-19: 店セレクタは「店ごとに見る」と「癖マトリクス」の両タブで
// 使い回す（どちらも「店を1つ選んで見る」画面のため）。今どちらのタブが
// アクティブかで、選択変更時にどちらを再描画するか切り替える。
let currentView = 'store';
sel.addEventListener('change', () => {
  if (currentView === 'matrix') {
    document.getElementById('body').innerHTML = renderMatrix(sel.value);
  } else if (currentView === 'modelpair') {
    document.getElementById('body').innerHTML = renderModelPairs(sel.value);
  } else {
    render(sel.value);
  }
});

const tabStore = document.getElementById('tab-store');
const tabMatrix = document.getElementById('tab-matrix');
const tabModelPair = document.getElementById('tab-modelpair');
const tabAll = document.getElementById('tab-all');
const tabHeat = document.getElementById('tab-heat');
const tabPicks = document.getElementById('tab-picks');
const tabCal = document.getElementById('tab-cal');
const ALL_TABS = [tabStore, tabMatrix, tabModelPair, tabAll, tabHeat, tabPicks, tabCal];

function setActiveTab(on){
  ALL_TABS.forEach(t => t.classList.toggle('on', t === on));
}
function showStore(){
  currentView = 'store';
  setActiveTab(tabStore);
  document.getElementById('picker').style.display = '';
  render(sel.value);
  try { localStorage.setItem('store_report_tab', 'store'); } catch (e) {}
}
function showMatrix(){
  currentView = 'matrix';
  setActiveTab(tabMatrix);
  document.getElementById('picker').style.display = '';
  document.getElementById('body').innerHTML = renderMatrix(sel.value);
  try { localStorage.setItem('store_report_tab', 'matrix'); } catch (e) {}
}
function showModelPair(){
  currentView = 'modelpair';
  setActiveTab(tabModelPair);
  document.getElementById('picker').style.display = '';
  document.getElementById('body').innerHTML = renderModelPairs(sel.value);
  try { localStorage.setItem('store_report_tab', 'modelpair'); } catch (e) {}
}
function showAll(){
  currentView = 'all';
  setActiveTab(tabAll);
  document.getElementById('picker').style.display = 'none';
  document.getElementById('body').innerHTML = renderOverview();
  try { localStorage.setItem('store_report_tab', 'all'); } catch (e) {}
}
function showHeat(){
  currentView = 'heat';
  setActiveTab(tabHeat);
  document.getElementById('picker').style.display = 'none';
  document.getElementById('body').innerHTML = renderHeatmap();
  bindHeatChips();
  redrawHeatGrid();
  try { localStorage.setItem('store_report_tab', 'heat'); } catch (e) {}
}
function showPicks(){
  currentView = 'picks';
  setActiveTab(tabPicks);
  document.getElementById('picker').style.display = 'none';
  document.getElementById('body').innerHTML = renderPicks();
  bindPicks();
  try { localStorage.setItem('store_report_tab', 'picks'); } catch (e) {}
}
function showCal(){
  currentView = 'cal';
  setActiveTab(tabCal);
  document.getElementById('picker').style.display = 'none';
  document.getElementById('body').innerHTML = renderCal();
  bindCal();
  try { localStorage.setItem('store_report_tab', 'cal'); } catch (e) {}
}
tabCal.addEventListener('click', showCal);
tabStore.addEventListener('click', showStore);
tabMatrix.addEventListener('click', showMatrix);
tabModelPair.addEventListener('click', showModelPair);
tabAll.addEventListener('click', showAll);
tabHeat.addEventListener('click', showHeat);
tabPicks.addEventListener('click', showPicks);

renderWarn();
const ENABLED_TABS = ["picks"];
let tab = 'picks';
try {
  const saved = localStorage.getItem('store_report_tab');
  if (saved && ENABLED_TABS.indexOf(saved) !== -1) tab = saved;
} catch (e) {}
if (URLQ.get('store')) tab = URLQ.get('tab') || 'store';
if (ENABLED_TABS.indexOf(tab) === -1) tab = ENABLED_TABS[0] || 'store';
if (tab === 'matrix') showMatrix();
else if (tab === 'modelpair') showModelPair();
else if (tab === 'all') showAll();
else if (tab === 'heat') showHeat();
else if (tab === 'picks') showPicks();
else if (tab === 'cal') showCal();
else showStore();
</script>
